name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libfuse2
      - name: Сборка .deb и .AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION=0.1.0-dev
          make deb appimage VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Сборка .exe
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION=0.1.0-dev
          go build -ldflags "-s -w -H windowsgui -X github.com/Serge-Nook/zigzag-nulya/internal/ui.Version=$VERSION" \
            -o "dist/T0P0R-$VERSION-windows-amd64.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
